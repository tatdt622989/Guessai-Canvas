services:
  guessai:
    build:
      context: .
      args:
        # Empty after day 90
        VITE_HANDOFF_URL: ${VITE_HANDOFF_URL-https://api.6yuwei.com/guessai_canvas/handoff}
    expose:
      - "3000"
    environment:
      TRUST_PROXY: "true"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://guessai-canvas.6yuwei.com}
      MONGODB_URI: ${MONGODB_URI}
      GUESSAI_GUEST_SECRET: ${GUESSAI_GUEST_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      GUESSAI_ADMIN_PASSWORD_HASH: ${GUESSAI_ADMIN_PASSWORD_HASH}
      GUESSAI_SESSION_SECRET: ${GUESSAI_SESSION_SECRET}
      HANDOFF_ENABLED: ${HANDOFF_ENABLED:-true}
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
volumes:
  uploads:
